[global_tags]
  env = "hadoop-lab"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  quiet = false

# ---------------------------------------------------------------------------
# INPUT: Docker plugin — se conecta al API de Docker directamente.
# Esto funciona en Docker Desktop/WSL2 porque no necesita acceder
# al sistema de archivos, solo al socket de Docker.
# ---------------------------------------------------------------------------
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  container_names = []
  source_tag = false
  container_name_include = [
    "namenode",
    "datanode1",
    "datanode2",
    "resourcemanager",
    "nodemanager",
    "jupyter-aula",
    "airflow-webserver",
    "airflow-scheduler",
    "prometheus",
    "grafana",
    "cadvisor",
    "node-exporter",
    "telegraf"
  ]
  timeout = "5s"
  perdevice = false
  total = false
  docker_label_include = []
  docker_label_exclude = []

# ---------------------------------------------------------------------------
# OUTPUT: Expone las métricas en formato Prometheus en el puerto 9273.
# Prometheus scrapeará este endpoint.
# ---------------------------------------------------------------------------
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  expiration_interval = "60s"
